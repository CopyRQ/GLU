<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakerSpot</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="container">
        <div id="header">SneakerSpot</div> <!-- einde header -->
        <div id="content">
            <h2>Onze sneakers</h2>

            <div class="product">
                <img src="images/airmax90.avif" alt="Nike Air Max 90">
                <h3>Nike Air Max 90</h3>
                <p class="prijs">&euro; 149,99</p>
            </div>

            <div class="product">
                <img src="images/samba.avif" alt="Adidas Samba" >
                <h3>Adidas Samba</h3>
                <p class="prijs">&euro; 120,00</p>
            </div>

            <div class="product">
                <img src="images/nb550.webp" alt="New Balance 550">
                <h3>New Balance 550</h3>
                <p class="prijs">&euro; 129,99</p>
            </div>
        </div> <!-- einde content -->
        <div id="footer">&copy; 2026 SneakerSpot</div> <!-- einde footer -->
    </div>
</body>
</html>
